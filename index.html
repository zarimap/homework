<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【デバッグ版】AI勉強時間管理アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-6 pb-64">
  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
    
    <header class="bg-indigo-600 text-white p-6 flex justify-between items-center">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-bold">AI勉強時間記録アプリ</h1>
          <span class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">DEBUG MODE</span>
        </div>
        <p class="text-indigo-200 text-sm mt-1">写真とAIで正しく勉強時間を可視化</p>
      </div>
      <button id="btn-logout" class="hidden bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg transition">ログアウト</button>
    </header>

    <div class="p-6">
      <!-- 接続状況診断バー -->
      <div id="debug-status-bar" class="mb-6 p-4 rounded-xl text-xs bg-slate-100 border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-2">
        <div class="flex items-center gap-2">
          <span class="font-bold">Supabase接続:</span>
          <span id="st-supabase" class="text-amber-600 font-semibold">未検証</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-bold">ネットワーク環境:</span>
          <span id="st-network" class="text-emerald-600 font-semibold">ONLINE</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-bold">現在ログイン:</span>
          <span id="st-user" class="text-slate-500 font-semibold">未ログイン</span>
        </div>
      </div>

      <!-- 認証エリア（ログイン / 新規登録） -->
      <section id="sec-auth" class="max-w-md mx-auto space-y-6 py-2">
        
        <!-- モード切り替えタブ -->
        <div class="flex border-b border-slate-200">
          <button id="tab-auth-login" type="button" class="flex-1 py-2 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer">ログイン</button>
          <button id="tab-auth-signup" type="button" class="flex-1 py-2 font-bold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 cursor-pointer">新規ユーザー登録</button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">メールアドレス (ID)</label>
            <input type="email" id="auth-email" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="example@email.com">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">パスワード</label>
            <input type="password" id="auth-password" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="6文字以上">
          </div>

          <!-- ログイン用ボタン -->
          <button id="btn-auth-login" type="button" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-3 rounded-lg shadow-md transition cursor-pointer">
            ログイン
          </button>

          <!-- 新規登録用ボタン -->
          <button id="btn-auth-signup" type="button" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold p-3 rounded-lg shadow-md transition cursor-pointer">
            アカウントを作成する
          </button>
        </div>
      </section>

      <!-- メインアプリ領域 -->
      <div id="sec-app" class="hidden space-y-8">
        
        <div class="flex border-b border-slate-200">
          <button id="tab-child" type="button" class="flex-1 py-3 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer">子ども用（記録・確認）</button>
          <button id="tab-parent" type="button" class="flex-1 py-3 font-semibold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 cursor-pointer">保護者用（ダッシュボード）</button>
        </div>

        <div id="view-child" class="space-y-8">
          <div class="bg-indigo-50/50 p-6 rounded-xl border border-indigo-100 space-y-4">
            <h2 class="text-lg font-bold text-indigo-900">新しい勉強記録の追加</h2>
            
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">勉強ノート・資料の写真</label>
              <input type="file" id="photo-input" accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200">
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">自己申告の勉強時間 (分)</label>
              <input type="number" id="self-time" placeholder="例: 45" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <button id="btn-submit" type="button" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-lg shadow transition flex justify-center items-center gap-2 cursor-pointer">
              <span>AIで判定して記録を保存</span>
            </button>
          </div>

          <div id="result-box" class="hidden p-5 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2">
            <h3 class="font-bold text-emerald-800 flex items-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              AI推定完了
            </h3>
            <div class="text-sm text-emerald-900 space-y-1">
              <p id="res-times"></p>
              <p id="res-reason" class="text-xs text-emerald-700 italic"></p>
            </div>
          </div>

          <div class="space-y-4">
            <h3 class="text-lg font-bold text-slate-800">今週の記録詳細 (日〜土)</h3>
            <div id="weekly-details-grid" class="grid grid-cols-1 md:grid-cols-7 gap-3">
            </div>
          </div>

          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <h3 class="text-lg font-bold text-slate-800">勉強時間の推移</h3>
              <div class="flex gap-2">
                <button id="btn-chart-month" type="button" class="px-3 py-1 bg-indigo-600 text-white text-xs font-semibold rounded-md cursor-pointer">1ヶ月 (週別)</button>
                <button id="btn-chart-year" type="button" class="px-3 py-1 bg-slate-200 text-slate-700 text-xs font-semibold rounded-md cursor-pointer">1年 (月別)</button>
              </div>
            </div>
            <div class="bg-white p-4 border rounded-xl shadow-sm">
              <canvas id="studyChart" class="w-full h-64"></canvas>
            </div>
          </div>
        </div>

        <div id="view-parent" class="hidden space-y-6">
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <h3 class="text-lg font-bold text-slate-800 mb-2">保護者確認ダッシュボード</h3>
            <p class="text-xs text-slate-500">お子様がアップロードした写真と自己申告、およびAIが最終決定した時間の全履歴を確認できます。</p>
          </div>

          <div class="overflow-x-auto border border-slate-200 rounded-xl">
            <table class="w-full text-left text-sm text-slate-600">
              <thead class="bg-slate-100 text-xs text-slate-700 uppercase">
                <tr>
                  <th class="p-3">日時</th>
                  <th class="p-3">写真</th>
                  <th class="p-3">自己申告</th>
                  <th class="p-3">AI推定</th>
                  <th class="p-3">確定時間</th>
                  <th class="p-3">AIのコメント</th>
                </tr>
              </thead>
              <tbody id="parent-history-list" class="divide-y divide-slate-200">
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 固定表示デバッグコンソールバー -->
  <div class="fixed bottom-0 left-0 right-0 h-56 bg-slate-900 text-slate-100 font-mono text-xs z-50 border-t-2 border-indigo-500 flex flex-col shadow-2xl">
    <div class="bg-slate-800 px-4 py-2 flex justify-between items-center border-b border-slate-700">
      <span class="font-bold text-indigo-400 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        リアルタイム・デバッグログコンソール
      </span>
      <div class="flex gap-2">
        <button id="btn-test-ping" class="px-2 py-0.5 bg-indigo-600 hover:bg-indigo-500 rounded text-white text-[10px]">Supabase通信テスト</button>
        <button id="btn-clear-log" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-300 text-[10px]">クリア</button>
      </div>
    </div>
    <div id="debug-log-container" class="p-3 overflow-y-auto flex-1 space-y-1">
      <div class="text-slate-500">[System] デバッグモニタを開始しました...</div>
    </div>
  </div>

  <script type="module">
    import { GoogleGenAI } from '@google/genai';

    // --- デバッグログ出力ロジック ---
    function log(type, message, details = null) {
      const container = document.getElementById('debug-log-container');
      if (!container) return;

      const time = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = "leading-relaxed border-b border-slate-800/50 pb-0.5";

      let colorClass = "text-slate-300";
      if (type === 'SUCCESS') colorClass = "text-emerald-400 font-semibold";
      if (type === 'WARN') colorClass = "text-amber-400 font-semibold";
      if (type === 'ERROR') colorClass = "text-rose-400 font-bold";
      if (type === 'INFO') colorClass = "text-sky-400";

      let text = `<span class="text-slate-500">[${time}]</span> <span class="${colorClass}">[${type}]</span> ${message}`;
      if (details) {
        text += `<pre class="mt-1 p-1 bg-slate-950 text-slate-400 rounded text-[10px] overflow-x-auto">${typeof details === 'object' ? JSON.stringify(details, null, 2) : details}</pre>`;
      }

      line.innerHTML = text;
      container.appendChild(line);
      container.scrollTop = container.scrollHeight;

      if (type === 'ERROR') console.error(`[${type}] ${message}`, details || '');
      else console.log(`[${type}] ${message}`, details || '');
    }

    // --- 設定値 ---
    const SUPABASE_URL = 'https://widujrxsvoqjadbjpyvf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpZHVqcnhzdm9xamFkYmpweXZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMjg2NjAsImV4cCI6MjEwMzkwNDY2MH0.p4z1ZhQ9AOFPiyrJGJYrqT3V1TbLDv4JjjlpbwREvD8';
    const GEMINI_API_KEY = 'GEMINI_API_KEY_PLACEHOLDER';

    let supabase = null;
    let ai = null;
    let currentChart = null;
    let currentUser = null;

    // --- 1. UIの切り替え ---
    function switchAuthMode(mode) {
      log('INFO', `認証モード切り替え: ${mode}`);
      const tabLogin = document.getElementById('tab-auth-login');
      const tabSignUp = document.getElementById('tab-auth-signup');
      const btnLogin = document.getElementById('btn-auth-login');
      const btnSignUp = document.getElementById('btn-auth-signup');

      if (mode === 'login') {
        tabLogin.className = "flex-1 py-2 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer";
        tabSignUp.className = "flex-1 py-2 font-bold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 cursor-pointer";
        btnLogin.classList.remove('hidden');
        btnSignUp.classList.add('hidden');
      } else {
        tabSignUp.className = "flex-1 py-2 font-bold text-center border-b-2 border-emerald-600 text-emerald-600 cursor-pointer";
        tabLogin.className = "flex-1 py-2 font-bold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 cursor-pointer";
        btnSignUp.classList.remove('hidden');
        btnLogin.classList.add('hidden');
      }
    }

    function switchRole(role) {
      log('INFO', `表示ロール切り替え: ${role}`);
      const childTab = document.getElementById('tab-child');
      const parentTab = document.getElementById('tab-parent');
      const childView = document.getElementById('view-child');
      const parentView = document.getElementById('view-parent');

      if (role === 'child') {
        childTab.className = "flex-1 py-3 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer";
        parentTab.className = "flex-1 py-3 font-semibold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 cursor-pointer";
        childView.classList.remove('hidden');
        parentView.classList.add('hidden');
      } else {
        parentTab.className = "flex-1 py-3 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer";
        childTab.className = "flex-1 py-3 font-semibold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 cursor-pointer";
        parentView.classList.remove('hidden');
        childView.classList.add('hidden');
      }
    }

    // --- 2. クライアントの初期化と疎通確認 ---
    function initClients() {
      log('INFO', 'クライアント初期化チェック中...');

      if (!SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_URL' || !SUPABASE_KEY || SUPABASE_KEY === 'YOUR_SUPABASE_ANON_KEY') {
        log('ERROR', 'SupabaseのURLまたはKeyがプレースホルダーのままです。');
        document.getElementById('st-supabase').innerText = '設定未入力';
        document.getElementById('st-supabase').className = 'text-rose-600 font-bold';
        return false;
      }

      try {
        if (!supabase) {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          log('SUCCESS', 'Supabaseクライアントインスタンスを生成しました。');
        }
        if (!ai) {
          ai = new GoogleGenAI({ apiKey: GEMINI_API_KEY });
          log('SUCCESS', 'GoogleGenAIクライアントインスタンスを生成しました。');
        }
        return true;
      } catch (err) {
        log('ERROR', 'クライアント初期化例外:', err);
        return false;
      }
    }

    async function testSupabaseConnection() {
      log('INFO', 'Supabase サーバーへ Ping リクエストを送信中...');
      if (!initClients()) return;

      try {
        const start = Date.now();
        const { data, error } = await supabase.from('study_logs').select('id').limit(1);
        const duration = Date.now() - start;

        if (error) {
          log('ERROR', `Supabase接続エラー (応答時間: ${duration}ms): ${error.message}`, error);
          document.getElementById('st-supabase').innerText = '接続失敗 (エラー)';
          document.getElementById('st-supabase').className = 'text-rose-600 font-bold';
        } else {
          log('SUCCESS', `Supabase接続成功 (応答時間: ${duration}ms)`);
          document.getElementById('st-supabase').innerText = `OK (${duration}ms)`;
          document.getElementById('st-supabase').className = 'text-emerald-600 font-bold';
        }
      } catch (err) {
        log('ERROR', 'ネットワーク接続・Fetch通信が完全に遮断された可能性:', err.message);
        document.getElementById('st-supabase').innerText = '通信失敗 (FetchError)';
        document.getElementById('st-supabase').className = 'text-rose-600 font-bold';
      }
    }

    // --- 3. 認証処理 ---
    async function handleLogin() {
      log('INFO', 'ログイン処理を開始します...');
      if (!initClients()) return;

      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();

      if (!email || !password) {
        log('WARN', 'メールアドレスまたはパスワードが入力されていません。');
        alert('メールアドレスとパスワードを入力してください。');
        return;
      }

      const btn = document.getElementById('btn-auth-login');
      btn.disabled = true;
      btn.innerText = 'ログイン中...';

      try {
        log('INFO', `ログイン要求送信中 (Email: ${email})`);
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
          log('ERROR', `ログイン拒否: ${error.message}`, error);
          alert('ログイン失敗: ' + error.message);
        } else {
          log('SUCCESS', `ログイン成功! User ID: ${data.user.id}`);
          currentUser = data.user;
          document.getElementById('st-user').innerText = email;
          document.getElementById('st-user').className = 'text-indigo-600 font-bold';
          showApp();
        }
      } catch (err) {
        log('ERROR', 'ログイン要求時の通信例外 (TypeError/Fetch failed等):', err);
        alert('通信エラーが発生しました:\n' + err.message + '\n\nデバッグログ画面を確認してください。');
      } finally {
        btn.disabled = false;
        btn.innerText = 'ログイン';
      }
    }

    async function handleSignUp() {
      log('INFO', '新規会員登録処理を開始します...');
      if (!initClients()) return;

      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();

      if (!email || !password) {
        log('WARN', '入力欄が空です。');
        alert('メールアドレスとパスワードを入力してください。');
        return;
      }

      if (password.length < 6) {
        log('WARN', 'パスワード桁数不足');
        alert('パスワードは6文字以上で設定してください。');
        return;
      }

      const btn = document.getElementById('btn-auth-signup');
      btn.disabled = true;
      btn.innerText = '登録中...';

      try {
        log('INFO', `アカウント作成要求送信中 (Email: ${email})`);
        const { data, error } = await supabase.auth.signUp({ email, password });
        
        if (error) {
          log('ERROR', `新規登録失敗: ${error.message}`, error);
          alert('登録失敗: ' + error.message);
        } else {
          log('SUCCESS', 'アカウント作成要求完了:', data);
          currentUser = data.user;
          if (currentUser) {
            alert('アカウント作成が完了しました！');
            showApp();
          } else {
            alert('確認メールを送信しました。メールのリンクをクリックしてログインしてください。');
            switchAuthMode('login');
          }
        }
      } catch (err) {
        log('ERROR', '新規登録時の通信例外:', err);
        alert('通信エラーが発生しました: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'アカウントを作成する';
      }
    }

    async function handleLogout() {
      log('INFO', 'ログアウト実行中...');
      if (supabase) {
        await supabase.auth.signOut();
      }
      location.reload();
    }

    function showApp() {
      log('INFO', 'メインアプリ画面を表示します。');
      document.getElementById('sec-auth').classList.add('hidden');
      document.getElementById('sec-app').classList.remove('hidden');
      document.getElementById('btn-logout').classList.remove('hidden');
      
      loadWeeklyDetails();
      renderChart('month');
      loadParentDashboard();
    }

    // --- 4. AI処理と保存 ---
    async function processStudySession() {
      log('INFO', 'AI解析および保存プロセスを開始...');
      if (!initClients()) return;

      const fileInput = document.getElementById('photo-input');
      const selfReported = parseInt(document.getElementById('self-time').value, 10);

      if (!fileInput.files[0] || isNaN(selfReported)) {
        log('WARN', '画像または自己申告時間が未設定');
        alert('写真の選択と自己申告時間を正しく入力してください。');
        return;
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'AI解析中...';

      try {
        const file = fileInput.files[0];
        log('INFO', `ファイル選択確認: ${file.name} (${file.size} bytes)`);

        const filePath = `${currentUser.id}/${Date.now()}_${file.name}`;
        log('INFO', `Supabase Storageへのファイルアップロード開始: ${filePath}`);
        
        const { error: uploadErr } = await supabase.storage.from('study-photos').upload(filePath, file);
        if (uploadErr) {
          log('ERROR', 'Storageアップロード失敗:', uploadErr);
          throw uploadErr;
        }
        log('SUCCESS', 'Storageアップロード完了');

        const { data: { publicUrl } } = supabase.storage.from('study-photos').getPublicUrl(filePath);
        log('INFO', `公開URL取得: ${publicUrl}`);

        log('INFO', '過去ログ検索中...');
        const { data: pastLogs, error: pastErr } = await supabase
          .from('study_logs')
          .select('self_reported_minutes, ai_estimated_minutes, final_calculated_minutes')
          .eq('user_id', currentUser.id)
          .order('created_at', { ascending: false })
          .limit(5);

        if (pastErr) log('WARN', '過去ログ取得失敗(スキップします):', pastErr);

        const historyContext = pastLogs && pastLogs.length > 0 ? JSON.stringify(pastLogs) : '過去履歴なし';
        const base64Data = await fileToBase64(file);

        log('INFO', 'Gemini API 呼び出し準備中...');
        const prompt = `
          あなたは学習時間判定AIです。提供されたノート・教材画像の内容（書き込み量、文字数、問題数等）と、自己申告時間をもとに、適切な勉強時間を算出してください。
          
          【本人の過去傾向（自己申告値, AI推定値, 確定値）】:
          ${historyContext}
          
          【今回の入力】:
          - 自己申告時間: ${selfReported}分
          
          【指示】:
          1. 画像から推定される勉強時間 (ai_estimated) を算出してください。
          2. 過去の傾向と自己申告の偏りを評価し、最終的な正確な勉強時間 (final_calculated) を提示してください。
          3. 出力は以下のJSON形式のみで返してください。

          {"ai_estimated": 数値, "final_calculated": 数値, "reason": "根拠（50文字以内）"}
        `;

        const response = await ai.models.generateContent({
          model: 'gemini-2.5-flash',
          contents: [
            prompt,
            { inlineData: { mimeType: file.type, data: base64Data } }
          ],
          config: { responseMimeType: 'application/json' }
        });

        log('SUCCESS', 'Gemini API から応答を受信:', response.text);
        const res = JSON.parse(response.text);

        log('INFO', 'Database (study_logs) へのインサート実行中...');
        const { error: dbErr } = await supabase.from('study_logs').insert({
          user_id: currentUser.id,
          image_url: publicUrl,
          self_reported_minutes: selfReported,
          ai_estimated_minutes: res.ai_estimated,
          final_calculated_minutes: res.final_calculated,
          ai_feedback: res.reason
        });

        if (dbErr) {
          log('ERROR', 'DB書き込み失敗:', dbErr);
          throw dbErr;
        }

        log('SUCCESS', 'すべてのデータを正常に記録しました！');

        document.getElementById('result-box').classList.remove('hidden');
        document.getElementById('res-times').innerText = `自己申告: ${selfReported}分 | AI推定: ${res.ai_estimated}分 → 確定時間: ${res.final_calculated}分`;
        document.getElementById('res-reason').innerText = `判定理由: ${res.reason}`;

        loadWeeklyDetails();
        renderChart('month');
        loadParentDashboard();

        document.getElementById('self-time').value = '';
        fileInput.value = '';

      } catch (err) {
        log('ERROR', '処理中の例外が発生しました:', err);
        alert('エラーが発生しました:\n' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'AIで判定して記録を保存';
      }
    }

    // --- 5. グラフ＆データ描画 ---
    async function renderChart(type) {
      if (!supabase || !currentUser) return;
      log('INFO', `グラフ再描画処理: ${type}`);

      const monthBtn = document.getElementById('btn-chart-month');
      const yearBtn = document.getElementById('btn-chart-year');

      if (type === 'month') {
        monthBtn.className = "px-3 py-1 bg-indigo-600 text-white text-xs font-semibold rounded-md cursor-pointer";
        yearBtn.className = "px-3 py-1 bg-slate-200 text-slate-700 text-xs font-semibold rounded-md cursor-pointer";
      } else {
        yearBtn.className = "px-3 py-1 bg-indigo-600 text-white text-xs font-semibold rounded-md cursor-pointer";
        monthBtn.className = "px-3 py-1 bg-slate-200 text-slate-700 text-xs font-semibold rounded-md cursor-pointer";
      }

      const { data: logs, error } = await supabase
        .from('study_logs')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: true });

      if (error) {
        log('ERROR', 'グラフ用データ取得エラー:', error);
        return;
      }

      let labels = [];
      let dataValues = [];

      if (type === 'month') {
        labels = ['3週前', '2週前', '先週', '今週'];
        dataValues = [0, 0, 0, 0];

        const now = new Date();
        const currentSun = new Date(now);
        currentSun.setDate(now.getDate() - now.getDay());
        currentSun.setHours(0,0,0,0);

        (logs || []).forEach(log => {
          const logDate = new Date(log.created_at);
          const diffDays = Math.floor((currentSun - logDate) / (1000 * 60 * 60 * 24));
          
          if (diffDays <= 0 && diffDays > -7) dataValues[3] += log.final_calculated_minutes;
          else if (diffDays > 0 && diffDays <= 7) dataValues[2] += log.final_calculated_minutes;
          else if (diffDays > 7 && diffDays <= 14) dataValues[1] += log.final_calculated_minutes;
          else if (diffDays > 14 && diffDays <= 21) dataValues[0] += log.final_calculated_minutes;
        });

      } else {
        labels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
        dataValues = new Array(12).fill(0);

        (logs || []).forEach(log => {
          const m = new Date(log.created_at).getMonth();
          dataValues[m] += log.final_calculated_minutes;
        });
      }

      if (currentChart) currentChart.destroy();

      const ctx = document.getElementById('studyChart').getContext('2d');
      currentChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '勉強時間 (分)',
            data: dataValues,
            backgroundColor: 'rgba(79, 70, 229, 0.7)',
            borderColor: 'rgb(79, 70, 229)',
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, title: { display: true, text: '分' } }
          }
        }
      });
    }

    async function loadWeeklyDetails() {
      if (!supabase || !currentUser) return;
      log('INFO', '週間詳細グリッド取得中...');

      const grid = document.getElementById('weekly-details-grid');
      grid.innerHTML = '';

      const daysName = ['日', '月', '火', '水', '木', '金', '土'];
      const now = new Date();
      const startOfWeek = new Date(now);
      startOfWeek.setDate(now.getDate() - now.getDay());
      startOfWeek.setHours(0, 0, 0, 0);

      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(startOfWeek.getDate() + 6);
      endOfWeek.setHours(23, 59, 59, 999);

      const { data: logs, error } = await supabase
        .from('study_logs')
        .select('*')
        .eq('user_id', currentUser.id)
        .gte('created_at', startOfWeek.toISOString())
        .lte('created_at', endOfWeek.toISOString());

      if (error) {
        log('ERROR', '週間データ読み込みエラー:', error);
        return;
      }

      for (let i = 0; i < 7; i++) {
        const targetDate = new Date(startOfWeek);
        targetDate.setDate(startOfWeek.getDate() + i);

        const dayLogs = (logs || []).filter(l => {
          const d = new Date(l.created_at);
          return d.getDate() === targetDate.getDate() && d.getMonth() === targetDate.getMonth();
        });

        const totalMinutes = dayLogs.reduce((acc, cur) => acc + cur.final_calculated_minutes, 0);

        const card = document.createElement('div');
        card.className = "bg-white p-3 border rounded-lg flex flex-col justify-between space-y-2 shadow-sm";
        
        let photosHtml = dayLogs.map(l => `<img src="${l.image_url}" class="w-full h-12 object-cover rounded shadow-inner" />`).join('');

        card.innerHTML = `
          <div class="flex justify-between items-center text-xs font-bold text-slate-500 border-b pb-1">
            <span>${daysName[i]} (${targetDate.getMonth()+1}/${targetDate.getDate()})</span>
            <span class="text-indigo-600">${totalMinutes}分</span>
          </div>
          <div class="grid grid-cols-2 gap-1 my-1">
            ${photosHtml || '<p class="text-[10px] text-slate-400 col-span-2 text-center py-2">記録なし</p>'}
          </div>
        `;
        grid.appendChild(card);
      }
    }

    async function loadParentDashboard() {
      if (!supabase || !currentUser) return;
      log('INFO', '保護者ダッシュボードのデータ一覧を取得中...');

      const container = document.getElementById('parent-history-list');
      
      const { data: logs, error } = await supabase
        .from('study_logs')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error) {
        log('ERROR', '保護者ダッシュボードデータ取得エラー:', error);
        return;
      }

      if (!logs || logs.length === 0) {
        container.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">データがありません</td></tr>`;
        return;
      }

      container.innerHTML = logs.map(l => {
        const d = new Date(l.created_at).toLocaleString('ja-JP');
        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 text-xs">${d}</td>
            <td class="p-3"><a href="${l.image_url}" target="_blank"><img src="${l.image_url}" class="w-10 h-10 object-cover rounded border" /></a></td>
            <td class="p-3">${l.self_reported_minutes}分</td>
            <td class="p-3">${l.ai_estimated_minutes}分</td>
            <td class="p-3 font-bold text-indigo-600">${l.final_calculated_minutes}分</td>
            <td class="p-3 text-xs text-slate-500">${l.ai_feedback || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 全域の未解決例外を検出してデバッグ画面に流す
    window.addEventListener('error', (evt) => {
      log('ERROR', `JavaScript実行時エラー: ${evt.message} (${evt.filename}:${evt.lineno})`);
    });

    window.addEventListener('unhandledrejection', (evt) => {
      log('ERROR', `非同期処理例外(Unhandled Rejection): ${evt.reason?.message || evt.reason}`);
    });

    // --- 6. DOM読み込み完了時にイベントを一括アタッチ ---
    document.addEventListener('DOMContentLoaded', () => {
      log('INFO', 'DOMの読み込みが完了しました。');

      // デバッグコントロール
      document.getElementById('btn-clear-log')?.addEventListener('click', () => {
        document.getElementById('debug-log-container').innerHTML = '';
      });
      document.getElementById('btn-test-ping')?.addEventListener('click', testSupabaseConnection);

      // タブ切り替えイベント
      document.getElementById('tab-auth-login')?.addEventListener('click', () => switchAuthMode('login'));
      document.getElementById('tab-auth-signup')?.addEventListener('click', () => switchAuthMode('signup'));
      document.getElementById('tab-child')?.addEventListener('click', () => switchRole('child'));
      document.getElementById('tab-parent')?.addEventListener('click', () => switchRole('parent'));

      // ボタンアクション
      document.getElementById('btn-auth-login')?.addEventListener('click', handleLogin);
      document.getElementById('btn-auth-signup')?.addEventListener('click', handleSignUp);
      document.getElementById('btn-logout')?.addEventListener('click', handleLogout);
      document.getElementById('btn-submit')?.addEventListener('click', processStudySession);
      document.getElementById('btn-chart-month')?.addEventListener('click', () => renderChart('month'));
      document.getElementById('btn-chart-year')?.addEventListener('click', () => renderChart('year'));

      // ネットワーク状態の監視
      window.addEventListener('online', () => {
        document.getElementById('st-network').innerText = 'ONLINE';
        document.getElementById('st-network').className = 'text-emerald-600 font-semibold';
        log('SUCCESS', 'ネットワークがONLINEに復帰しました');
      });
      window.addEventListener('offline', () => {
        document.getElementById('st-network').innerText = 'OFFLINE';
        document.getElementById('st-network').className = 'text-rose-600 font-bold';
        log('ERROR', 'ネットワークが切断されました(OFFLINE)');
      });

      // 自動初期化とテスト
      if (initClients()) {
        testSupabaseConnection();
        supabase.auth.getSession().then(({ data: { session }, error }) => {
          if (error) {
            log('WARN', 'セッション取得エラー:', error);
            return;
          }
          if (session) {
            log('SUCCESS', `既存セッション検出 (User: ${session.user.email})`);
            currentUser = session.user;
            document.getElementById('st-user').innerText = session.user.email;
            document.getElementById('st-user').className = 'text-indigo-600 font-bold';
            showApp();
          } else {
            log('INFO', 'アクティブな既存セッションはありません。');
          }
        }).catch(err => log('WARN', 'セッション確認例外:', err));
      }
    });
  </script>
</body>
