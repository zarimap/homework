<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【デバッグ版】AI勉強時間管理アプリ (GASプロキシモード)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-6 pb-64">
  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
    
    <header class="bg-indigo-600 text-white p-6 flex justify-between items-center">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-bold">AI勉強時間記録アプリ</h1>
          <span class="bg-amber-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">GAS PROXY MODE</span>
        </div>
        <p class="text-indigo-200 text-sm mt-1">写真とAIで正しく勉強時間を可視化</p>
      </div>
      <button id="btn-logout" class="hidden bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg transition">ログアウト</button>
    </header>

    <div class="p-6">
      <!-- 接続状況診断バー -->
      <div id="debug-status-bar" class="mb-6 p-4 rounded-xl text-xs bg-slate-100 border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-2">
        <div class="flex items-center gap-2">
          <span class="font-bold">GASプロキシ接続:</span>
          <span id="st-supabase" class="text-amber-600 font-semibold">未検証</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-bold">ネットワーク環境:</span>
          <span id="st-network" class="text-emerald-600 font-semibold">ONLINE</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-bold">現在ログイン:</span>
          <span id="st-user" class="text-slate-500 font-semibold">未ログイン</span>
        </div>
      </div>

      <!-- 認証エリア（ログイン / 新規登録） -->
      <section id="sec-auth" class="max-w-md mx-auto space-y-6 py-2">
        <div class="flex border-b border-slate-200">
          <button id="tab-auth-login" type="button" class="flex-1 py-2 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer">ログイン</button>
          <button id="tab-auth-signup" type="button" class="flex-1 py-2 font-bold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 cursor-pointer">新規ユーザー登録</button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">メールアドレス (ID)</label>
            <input type="email" id="auth-email" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="example@email.com">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">パスワード</label>
            <input type="password" id="auth-password" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="6文字以上">
          </div>

          <button id="btn-auth-login" type="button" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-3 rounded-lg shadow-md transition cursor-pointer">
            ログイン
          </button>
          <button id="btn-auth-signup" type="button" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold p-3 rounded-lg shadow-md transition cursor-pointer">
            アカウントを作成する
          </button>
        </div>
      </section>

      <!-- メインアプリ領域 -->
      <div id="sec-app" class="hidden space-y-8">
        <div class="flex border-b border-slate-200">
          <button id="tab-child" type="button" class="flex-1 py-3 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer">子ども用（記録・確認）</button>
          <button id="tab-parent" type="button" class="flex-1 py-3 font-semibold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 cursor-pointer">保護者用（ダッシュボード）</button>
        </div>

        <div id="view-child" class="space-y-8">
          <div class="bg-indigo-50/50 p-6 rounded-xl border border-indigo-100 space-y-4">
            <h2 class="text-lg font-bold text-indigo-900">新しい勉強記録の追加</h2>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">勉強ノート・資料の写真</label>
              <input type="file" id="photo-input" accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">自己申告の勉強時間 (分)</label>
              <input type="number" id="self-time" placeholder="例: 45" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <button id="btn-submit" type="button" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-lg shadow transition flex justify-center items-center gap-2 cursor-pointer">
              <span>AIで判定して記録を保存</span>
            </button>
          </div>

          <div id="result-box" class="hidden p-5 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2">
            <h3 class="font-bold text-emerald-800 flex items-center gap-2">AI推定完了</h3>
            <div class="text-sm text-emerald-900 space-y-1">
              <p id="res-times"></p>
              <p id="res-reason" class="text-xs text-emerald-700 italic"></p>
            </div>
          </div>

          <div class="space-y-4">
            <h3 class="text-lg font-bold text-slate-800">今週の記録詳細 (日〜土)</h3>
            <div id="weekly-details-grid" class="grid grid-cols-1 md:grid-cols-7 gap-3"></div>
          </div>

          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <h3 class="text-lg font-bold text-slate-800">勉強時間の推移</h3>
              <div class="flex gap-2">
                <button id="btn-chart-month" type="button" class="px-3 py-1 bg-indigo-600 text-white text-xs font-semibold rounded-md cursor-pointer">1ヶ月 (週別)</button>
                <button id="btn-chart-year" type="button" class="px-3 py-1 bg-slate-200 text-slate-700 text-xs font-semibold rounded-md cursor-pointer">1年 (月別)</button>
              </div>
            </div>
            <div class="bg-white p-4 border rounded-xl shadow-sm">
              <canvas id="studyChart" class="w-full h-64"></canvas>
            </div>
          </div>
        </div>

        <div id="view-parent" class="hidden space-y-6">
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <h3 class="text-lg font-bold text-slate-800 mb-2">保護者確認ダッシュボード</h3>
            <p class="text-xs text-slate-500">全履歴を確認できます。</p>
          </div>
          <div class="overflow-x-auto border border-slate-200 rounded-xl">
            <table class="w-full text-left text-sm text-slate-600">
              <thead class="bg-slate-100 text-xs text-slate-700 uppercase">
                <tr>
                  <th class="p-3">日時</th>
                  <th class="p-3">写真</th>
                  <th class="p-3">自己申告</th>
                  <th class="p-3">AI推定</th>
                  <th class="p-3">確定時間</th>
                  <th class="p-3">AIのコメント</th>
                </tr>
              </thead>
              <tbody id="parent-history-list" class="divide-y divide-slate-200"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- デバッグコンソール -->
  <div class="fixed bottom-0 left-0 right-0 h-56 bg-slate-900 text-slate-100 font-mono text-xs z-50 border-t-2 border-indigo-500 flex flex-col shadow-2xl">
    <div class="bg-slate-800 px-4 py-2 flex justify-between items-center border-b border-slate-700">
      <span class="font-bold text-indigo-400">リアルタイム・デバッグログコンソール (GAS Proxy)</span>
      <div class="flex gap-2">
        <button id="btn-test-ping" class="px-2 py-0.5 bg-indigo-600 hover:bg-indigo-500 rounded text-white text-[10px]">GAS通信テスト</button>
        <button id="btn-clear-log" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-300 text-[10px]">クリア</button>
      </div>
    </div>
    <div id="debug-log-container" class="p-3 overflow-y-auto flex-1 space-y-1"></div>
  </div>

  <script>
    // ★ GASデプロイ後のウェブアプリURLを入力してください
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzwtkHV1IUHgNVjPWN3K77RHBZzRfuPuXuxtNQVOK52cMo9tUKT4kJE1X7-FQE7aAiW9Q/exec';

    let currentSession = null;
    let currentChart = null;

    function log(type, message, details = null) {
      const container = document.getElementById('debug-log-container');
      if (!container) return;
      const time = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      let colorClass = "text-slate-300";
      if (type === 'SUCCESS') colorClass = "text-emerald-400 font-semibold";
      if (type === 'WARN') colorClass = "text-amber-400 font-semibold";
      if (type === 'ERROR') colorClass = "text-rose-400 font-bold";
      if (type === 'INFO') colorClass = "text-sky-400";

      let text = `<span class="text-slate-500">[${time}]</span> <span class="${colorClass}">[${type}]</span> ${message}`;
      if (details) {
        text += `<pre class="mt-1 p-1 bg-slate-950 text-slate-400 rounded text-[10px] overflow-x-auto">${typeof details === 'object' ? JSON.stringify(details, null, 2) : details}</pre>`;
      }
      line.innerHTML = text;
      container.appendChild(line);
      container.scrollTop = container.scrollHeight;
    }

    // GAS経由での通信共通関数
    async function sendGasRequest(action, payload = {}) {
      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: action,
            payload: payload,
            access_token: currentSession ? currentSession.access_token : null
          })
        });
        return await response.json();
      } catch (err) {
        log('ERROR', 'GASプロキシ通信失敗:', err.message);
        throw err;
      }
    }

    async function testGasConnection() {
      log('INFO', 'GAS経由でPingテスト中...');
      try {
        const start = Date.now();
        const res = await sendGasRequest('ping');
        const duration = Date.now() - start;
        
        if (res.error) {
          log('ERROR', `GASエラー: ${res.message || JSON.stringify(res)}`);
          document.getElementById('st-supabase').innerText = '接続失敗';
          document.getElementById('st-supabase').className = 'text-rose-600 font-bold';
        } else {
          log('SUCCESS', `GASプロキシ通信成功 (${duration}ms)`);
          document.getElementById('st-supabase').innerText = `OK (${duration}ms)`;
          document.getElementById('st-supabase').className = 'text-emerald-600 font-bold';
        }
      } catch (err) {
        document.getElementById('st-supabase').innerText = '通信エラー';
        document.getElementById('st-supabase').className = 'text-rose-600 font-bold';
      }
    }

    async function handleLogin() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      if (!email || !password) return alert('入力してください');

      log('INFO', `GAS経由でログイン送信: ${email}`);
      const btn = document.getElementById('btn-auth-login');
      btn.disabled = true;

      try {
        const res = await sendGasRequest('login', { email, password });
        if (res.access_token) {
          log('SUCCESS', 'ログイン成功');
          currentSession = res;
          localStorage.setItem('gas_session', JSON.stringify(res));
          document.getElementById('st-user').innerText = res.user.email;
          showApp();
        } else {
          log('ERROR', 'ログイン拒否:', res);
          alert('ログイン失敗: ' + (res.error_description || JSON.stringify(res)));
        }
      } finally {
        btn.disabled = false;
      }
    }

    async function handleSignUp() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      if (!email || !password) return alert('入力してください');

      log('INFO', `新規登録送信: ${email}`);
      const res = await sendGasRequest('signup', { email, password });
      if (res.id) {
        log('SUCCESS', 'アカウント作成完了');
        alert('登録が完了しました。ログインしてください。');
        switchAuthMode('login');
      } else {
        log('ERROR', '新規登録失敗:', res);
        alert('登録失敗: ' + JSON.stringify(res));
      }
    }

    async function processStudySession() {
      const fileInput = document.getElementById('photo-input');
      const selfReported = parseInt(document.getElementById('self-time').value, 10);
      if (!fileInput.files[0] || isNaN(selfReported)) return alert('写真と時間を指定してください');

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'GASプロキシ経由でAI解析中...';

      try {
        const file = fileInput.files[0];
        const base64 = await fileToBase64(file);

        // 過去ログ取得
        const pastLogs = await sendGasRequest('fetch_logs', { user_id: currentSession.user.id, limit: 5 });

        log('INFO', '画像および判定データをGASに送信中...');
        const res = await sendGasRequest('upload_and_process', {
          user_id: currentSession.user.id,
          base64_image: base64,
          mime_type: file.type,
          file_name: file.name,
          self_reported: selfReported,
          history: Array.isArray(pastLogs) ? pastLogs : []
        });

        if (res.success) {
          log('SUCCESS', 'AI解析＆保存完了');
          document.getElementById('result-box').classList.remove('hidden');
          document.getElementById('res-times').innerText = `自己申告: ${selfReported}分 | AI推定: ${res.data.ai.ai_estimated}分 → 確定時間: ${res.data.ai.final_calculated}分`;
          document.getElementById('res-reason').innerText = `判定理由: ${res.data.ai.reason}`;

          loadWeeklyDetails();
          renderChart('month');
          loadParentDashboard();
        } else {
          log('ERROR', 'AI解析エラー:', res);
        }
      } catch (err) {
        log('ERROR', '保存例外:', err);
      } finally {
        btn.disabled = false;
        btn.innerText = 'AIで判定して記録を保存';
      }
    }

    async function loadWeeklyDetails() {
      if (!currentSession) return;
      const daysName = ['日', '月', '火', '水', '木', '金', '土'];
      const now = new Date();
      const startOfWeek = new Date(now);
      startOfWeek.setDate(now.getDate() - now.getDay());
      startOfWeek.setHours(0,0,0,0);
      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(startOfWeek.getDate() + 6);
      endOfWeek.setHours(23,59,59,999);

      const logs = await sendGasRequest('fetch_logs', {
        user_id: currentSession.user.id,
        gte: startOfWeek.toISOString(),
        lte: endOfWeek.toISOString()
      });

      const grid = document.getElementById('weekly-details-grid');
      grid.innerHTML = '';

      for (let i = 0; i < 7; i++) {
        const targetDate = new Date(startOfWeek);
        targetDate.setDate(startOfWeek.getDate() + i);

        const dayLogs = Array.isArray(logs) ? logs.filter(l => {
          const d = new Date(l.created_at);
          return d.getDate() === targetDate.getDate() && d.getMonth() === targetDate.getMonth();
        }) : [];

        const totalMinutes = dayLogs.reduce((acc, cur) => acc + cur.final_calculated_minutes, 0);

        const card = document.createElement('div');
        card.className = "bg-white p-3 border rounded-lg flex flex-col justify-between space-y-2 shadow-sm";
        let photosHtml = dayLogs.map(l => `<img src="${l.image_url}" class="w-full h-12 object-cover rounded shadow-inner" />`).join('');

        card.innerHTML = `
          <div class="flex justify-between items-center text-xs font-bold text-slate-500 border-b pb-1">
            <span>${daysName[i]} (${targetDate.getMonth()+1}/${targetDate.getDate()})</span>
            <span class="text-indigo-600">${totalMinutes}分</span>
          </div>
          <div class="grid grid-cols-2 gap-1 my-1">
            ${photosHtml || '<p class="text-[10px] text-slate-400 col-span-2 text-center py-2">記録なし</p>'}
          </div>
        `;
        grid.appendChild(card);
      }
    }

    async function loadParentDashboard() {
      if (!currentSession) return;
      const logs = await sendGasRequest('fetch_logs', { user_id: currentSession.user.id });
      const container = document.getElementById('parent-history-list');

      if (!Array.isArray(logs) || logs.length === 0) {
        container.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">データがありません</td></tr>`;
        return;
      }

      container.innerHTML = logs.map(l => `
        <tr class="hover:bg-slate-50 transition">
          <td class="p-3 text-xs">${new Date(l.created_at).toLocaleString('ja-JP')}</td>
          <td class="p-3"><a href="${l.image_url}" target="_blank"><img src="${l.image_url}" class="w-10 h-10 object-cover rounded border" /></a></td>
          <td class="p-3">${l.self_reported_minutes}分</td>
          <td class="p-3">${l.ai_estimated_minutes}分</td>
          <td class="p-3 font-bold text-indigo-600">${l.final_calculated_minutes}分</td>
          <td class="p-3 text-xs text-slate-500">${l.ai_feedback || '-'}</td>
        </tr>
      `).join('');
    }

    async function renderChart(type) {
      if (!currentSession) return;
      const logs = await sendGasRequest('fetch_logs', { user_id: currentSession.user.id });
      if (!Array.isArray(logs)) return;

      let labels = ['3週前', '2週前', '先週', '今週'];
      let dataValues = [0, 0, 0, 0];

      const now = new Date();
      const currentSun = new Date(now);
      currentSun.setDate(now.getDate() - now.getDay());
      currentSun.setHours(0,0,0,0);

      logs.forEach(log => {
        const logDate = new Date(log.created_at);
        const diffDays = Math.floor((currentSun - logDate) / (1000 * 60 * 60 * 24));
        if (diffDays <= 0 && diffDays > -7) dataValues[3] += log.final_calculated_minutes;
        else if (diffDays > 0 && diffDays <= 7) dataValues[2] += log.final_calculated_minutes;
        else if (diffDays > 7 && diffDays <= 14) dataValues[1] += log.final_calculated_minutes;
        else if (diffDays > 14 && diffDays <= 21) dataValues[0] += log.final_calculated_minutes;
      });

      if (currentChart) currentChart.destroy();
      const ctx = document.getElementById('studyChart').getContext('2d');
      currentChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '勉強時間 (分)',
            data: dataValues,
            backgroundColor: 'rgba(79, 70, 229, 0.7)',
            borderColor: 'rgb(79, 70, 229)',
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function switchAuthMode(mode) {
      document.getElementById('btn-auth-login').classList.toggle('hidden', mode !== 'login');
      document.getElementById('btn-auth-signup').classList.toggle('hidden', mode === 'login');
    }

    function switchRole(role) {
      document.getElementById('view-child').classList.toggle('hidden', role !== 'child');
      document.getElementById('view-parent').classList.toggle('hidden', role === 'child');
    }

    function showApp() {
      document.getElementById('sec-auth').classList.add('hidden');
      document.getElementById('sec-app').classList.remove('hidden');
      document.getElementById('btn-logout').classList.remove('hidden');
      loadWeeklyDetails();
      renderChart('month');
      loadParentDashboard();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-test-ping')?.addEventListener('click', testGasConnection);
      document.getElementById('btn-auth-login')?.addEventListener('click', handleLogin);
      document.getElementById('btn-auth-signup')?.addEventListener('click', handleSignUp);
      document.getElementById('btn-submit')?.addEventListener('click', processStudySession);
      document.getElementById('btn-clear-log')?.addEventListener('click', () => {
        document.getElementById('debug-log-container').innerHTML = '';
      });
      document.getElementById('tab-auth-login')?.addEventListener('click', () => switchAuthMode('login'));
      document.getElementById('tab-auth-signup')?.addEventListener('click', () => switchAuthMode('signup'));
      document.getElementById('tab-child')?.addEventListener('click', () => switchRole('child'));
      document.getElementById('tab-parent')?.addEventListener('click', () => switchRole('parent'));

      const saved = localStorage.getItem('gas_session');
      if (saved) {
        currentSession = JSON.parse(saved);
        document.getElementById('st-user').innerText = currentSession.user.email;
        showApp();
      }
      testGasConnection();
    });
  </script>
</body>
</html>
