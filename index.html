<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI勉強時間管理アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-6">
  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
    
    <header class="bg-indigo-600 text-white p-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">AI勉強時間記録アプリ</h1>
        <p class="text-indigo-200 text-sm mt-1">写真とAIで正しく勉強時間を可視化</p>
      </div>
      <button id="btn-logout" class="hidden bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg transition cursor-pointer">ログアウト</button>
    </header>

    <div class="p-6">
      <section id="sec-auth" class="max-w-md mx-auto space-y-6 py-6">
        
        <div class="flex border-b border-slate-200">
          <button id="tab-auth-login" class="flex-1 py-2 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 transition">ログイン</button>
          <button id="tab-auth-signup" class="flex-1 py-2 font-bold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 transition">新規ユーザー登録</button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">メールアドレス (ID)</label>
            <input type="email" id="auth-email" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="example@email.com">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">パスワード</label>
            <input type="password" id="auth-password" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="6文字以上">
          </div>

          <button id="btn-auth-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-3 rounded-lg shadow-md transition cursor-pointer">
            ログイン
          </button>

          <button id="btn-auth-signup" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold p-3 rounded-lg shadow-md transition cursor-pointer">
            アカウントを作成する
          </button>
        </div>

        <div id="auth-status" class="p-3 rounded-lg bg-blue-50 border border-blue-200 hidden">
          <p class="text-sm text-blue-800">ℹ️ デモモード: 実際のバックエンド接続は、Supabase APIキーを設定してください</p>
        </div>
      </section>

      <div id="sec-app" class="hidden space-y-8">
        
        <div class="flex border-b border-slate-200">
          <button id="tab-child" class="flex-1 py-3 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 transition">子ども用（記録・確認）</button>
          <button id="tab-parent" class="flex-1 py-3 font-semibold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 transition">保護者用（ダッシュボード）</button>
        </div>

        <div id="view-child" class="space-y-8">
          <div class="bg-indigo-50/50 p-6 rounded-xl border border-indigo-100 space-y-4">
            <h2 class="text-lg font-bold text-indigo-900">新しい勉強記録の追加</h2>
            
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">勉強ノート・資料の写真</label>
              <input type="file" id="photo-input" accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200">
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">自己申告の勉強時間 (分)</label>
              <input type="number" id="self-time" placeholder="例: 45" min="1" max="480" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <button id="btn-submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-lg shadow transition flex justify-center items-center gap-2 cursor-pointer">
              <span>AIで判定して記録を保存</span>
            </button>
          </div>

          <div id="result-box" class="hidden p-5 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2">
            <h3 class="font-bold text-emerald-800 flex items-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              AI推定完了
            </h3>
            <div class="text-sm text-emerald-900 space-y-1">
              <p id="res-times"></p>
              <p id="res-reason" class="text-xs text-emerald-700 italic"></p>
            </div>
          </div>

          <div class="space-y-4">
            <h3 class="text-lg font-bold text-slate-800">今週の記録詳細 (日〜土)</h3>
            <div id="weekly-details-grid" class="grid grid-cols-1 md:grid-cols-7 gap-3">
            </div>
          </div>

          <div class="space-y-4">
            <div class="flex justify-between items-center">
              <h3 class="text-lg font-bold text-slate-800">勉強時間の推移</h3>
              <div class="flex gap-2">
                <button id="btn-chart-month" class="px-3 py-1 bg-indigo-600 text-white text-xs font-semibold rounded-md cursor-pointer">1ヶ月 (週別)</button>
                <button id="btn-chart-year" class="px-3 py-1 bg-slate-200 text-slate-700 text-xs font-semibold rounded-md cursor-pointer hover:bg-slate-300">1年 (月別)</button>
              </div>
            </div>
            <div class="bg-white p-4 border rounded-xl shadow-sm">
              <canvas id="studyChart" class="w-full h-64"></canvas>
            </div>
          </div>
        </div>

        <div id="view-parent" class="hidden space-y-6">
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <h3 class="text-lg font-bold text-slate-800 mb-2">保護者確認ダッシュボード</h3>
            <p class="text-xs text-slate-500">お子様がアップロードした写真と自己申告、およびAIが最終決定した時間の全履歴を確認できます。</p>
          </div>

          <div class="overflow-x-auto border border-slate-200 rounded-xl">
            <table class="w-full text-left text-sm text-slate-600">
              <thead class="bg-slate-100 text-xs text-slate-700 uppercase">
                <tr>
                  <th class="p-3">日時</th>
                  <th class="p-3">写真</th>
                  <th class="p-3">自己申告</th>
                  <th class="p-3">AI推定</th>
                  <th class="p-3">確定時間</th>
                  <th class="p-3">AIのコメント</th>
                </tr>
              </thead>
              <tbody id="parent-history-list" class="divide-y divide-slate-200">
                <tr><td colspan="6" class="p-4 text-center text-slate-400">データがありません</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
  // ===== グローバル状態管理 =====
  let currentChart = null;
  let currentUser = null;
  let mockData = []; // ローカルデモ用データ

  // Supabase設定
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const USE_SUPABASE = SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_KEY !== 'YOUR_SUPABASE_ANON_KEY';

  let supabase = null;
  if (USE_SUPABASE && window.supabase) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  // ===== ユーティリティ関数 =====
  function showNotification(message, type = 'info') {
    const alertClass = {
      'success': 'bg-emerald-100 text-emerald-800 border-emerald-300',
      'error': 'bg-red-100 text-red-800 border-red-300',
      'info': 'bg-blue-100 text-blue-800 border-blue-300'
    }[type] || 'bg-blue-100 text-blue-800 border-blue-300';

    const div = document.createElement('div');
    div.className = `fixed top-4 right-4 p-4 rounded-lg border shadow-lg ${alertClass} z-50 max-w-sm`;
    div.textContent = message;
    document.body.appendChild(div);

    setTimeout(() => div.remove(), 3000);
  }

  // ===== UI切り替え関数 =====
  function switchAuthMode(mode) {
    const tabLogin = document.getElementById('tab-auth-login');
    const tabSignUp = document.getElementById('tab-auth-signup');
    const btnLogin = document.getElementById('btn-auth-login');
    const btnSignUp = document.getElementById('btn-auth-signup');

    if (mode === 'login') {
      tabLogin.className = "flex-1 py-2 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 transition cursor-pointer";
      tabSignUp.className = "flex-1 py-2 font-bold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 transition cursor-pointer";
      btnLogin.classList.remove('hidden');
      btnSignUp.classList.add('hidden');
    } else {
      tabSignUp.className = "flex-1 py-2 font-bold text-center border-b-2 border-emerald-600 text-emerald-600 transition cursor-pointer";
      tabLogin.className = "flex-1 py-2 font-bold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 transition cursor-pointer";
      btnSignUp.classList.remove('hidden');
      btnLogin.classList.add('hidden');
    }
  }

  function switchRole(role) {
    const childTab = document.getElementById('tab-child');
    const parentTab = document.getElementById('tab-parent');
    const childView = document.getElementById('view-child');
    const parentView = document.getElementById('view-parent');

    if (role === 'child') {
      childTab.className = "flex-1 py-3 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 transition cursor-pointer";
      parentTab.className = "flex-1 py-3 font-semibold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 transition cursor-pointer";
      childView.classList.remove('hidden');
      parentView.classList.add('hidden');
    } else {
      parentTab.className = "flex-1 py-3 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 transition cursor-pointer";
      childTab.className = "flex-1 py-3 font-semibold text-center text-slate-500 border-b-2 border-transparent hover:text-slate-700 transition cursor-pointer";
      parentView.classList.remove('hidden');
      childView.classList.add('hidden');
    }
    loadParentDashboard();
  }

  function showApp() {
    document.getElementById('sec-auth').classList.add('hidden');
    document.getElementById('sec-app').classList.remove('hidden');
    document.getElementById('btn-logout').classList.remove('hidden');
    
    loadWeeklyDetails();
    renderChart('month');
    loadParentDashboard();
    showNotification('ログインしました！', 'success');
  }

  // ===== 認証処理 =====
  async function handleLogin(e) {
    if (e) e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value.trim();

    if (!email || !password) {
      showNotification('メールアドレスとパスワードを入力してください。', 'error');
      return;
    }

    try {
      if (USE_SUPABASE && supabase) {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user;
      } else {
        // デモモード動作
        currentUser = { id: 'demo-user-1', email: email };
      }
      showApp();
    } catch (err) {
      showNotification('ログイン失敗: ' + err.message, 'error');
    }
  }

  async function handleSignUp(e) {
    if (e) e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value.trim();

    if (!email || !password) {
      showNotification('メールアドレスとパスワードを入力してください。', 'error');
      return;
    }

    if (password.length < 6) {
      showNotification('パスワードは6文字以上で設定してください。', 'error');
      return;
    }

    try {
      if (USE_SUPABASE && supabase) {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        currentUser = data.user;
      } else {
        currentUser = { id: 'demo-user-1', email: email };
      }
      showApp();
    } catch (err) {
      showNotification('登録失敗: ' + err.message, 'error');
    }
  }

  async function handleLogout() {
    if (USE_SUPABASE && supabase) {
      await supabase.auth.signOut();
    }
    currentUser = null;
    mockData = [];
    location.reload();
  }

  // ===== 表示データ処理 =====
  function loadWeeklyDetails() {
    const grid = document.getElementById('weekly-details-grid');
    if (!grid) return;
    grid.innerHTML = '';

    const daysName = ['日', '月', '火', '水', '木', '金', '土'];
    const now = new Date();
    const startOfWeek = new Date(now);
    startOfWeek.setDate(now.getDate() - now.getDay());

    for (let i = 0; i < 7; i++) {
      const targetDate = new Date(startOfWeek);
      targetDate.setDate(startOfWeek.getDate() + i);

      const dayLogs = mockData.filter(l => {
        const d = new Date(l.created_at);
        return d.getDate() === targetDate.getDate() && currentUser && l.user_id === currentUser.id;
      });

      const totalMinutes = dayLogs.reduce((acc, cur) => acc + cur.final_calculated_minutes, 0);

      const card = document.createElement('div');
      card.className = "bg-white p-3 border rounded-lg flex flex-col justify-between space-y-2 shadow-sm";
      card.innerHTML = `
        <div class="flex justify-between items-center text-xs font-bold text-slate-500 border-b pb-1">
          <span>${daysName[i]} (${targetDate.getMonth()+1}/${targetDate.getDate()})</span>
          <span class="text-indigo-600">${totalMinutes}分</span>
        </div>
        <div class="text-xs text-center text-slate-400 py-2">
          ${dayLogs.length > 0 ? `${dayLogs.length}件の記録` : '記録なし'}
        </div>
      `;
      grid.appendChild(card);
    }
  }

  function loadParentDashboard() {
    const container = document.getElementById('parent-history-list');
    if (!container) return;

    if (!currentUser || mockData.length === 0) {
      container.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">データがありません</td></tr>`;
      return;
    }

    const userLogs = mockData.filter(l => l.user_id === currentUser.id);
    container.innerHTML = userLogs.map(l => `
      <tr class="hover:bg-slate-50 transition">
        <td class="p-3 text-xs">${new Date(l.created_at).toLocaleString('ja-JP')}</td>
        <td class="p-3"><img src="${l.image_url}" class="w-10 h-10 object-cover rounded" /></td>
        <td class="p-3">${l.self_reported_minutes}分</td>
        <td class="p-3">${l.ai_estimated_minutes}分</td>
        <td class="p-3 font-bold text-indigo-600">${l.final_calculated_minutes}分</td>
        <td class="p-3 text-xs text-slate-500">${l.ai_feedback || '-'}</td>
      </tr>
    `).join('');
  }

  function renderChart(type) {
    const chartEl = document.getElementById('studyChart');
    if (!chartEl) return;
    const ctx = chartEl.getContext('2d');

    if (currentChart) currentChart.destroy();

    currentChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: type === 'month' ? ['3週前', '2週前', '先週', '今週'] : ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
        datasets: [{
          label: '勉強時間 (分)',
          data: type === 'month' ? [0, 0, 0, 0] : new Array(12).fill(0),
          backgroundColor: 'rgba(79, 70, 229, 0.7)',
          borderRadius: 6
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  // ===== 初期化処理 =====
  document.addEventListener('DOMContentLoaded', () => {
    // タブ切り替えの初期表示を設定
    switchAuthMode('login');

    // イベントリスナーの登録
    document.getElementById('tab-auth-login').addEventListener('click', () => switchAuthMode('login'));
    document.getElementById('tab-auth-signup').addEventListener('click', () => switchAuthMode('signup'));

    document.getElementById('btn-auth-login').addEventListener('click', handleLogin);
    document.getElementById('btn-auth-signup').addEventListener('click', handleSignUp);
    document.getElementById('btn-logout').addEventListener('click', handleLogout);

    document.getElementById('tab-child').addEventListener('click', () => switchRole('child'));
    document.getElementById('tab-parent').addEventListener('click', () => switchRole('parent'));

    document.getElementById('btn-chart-month').addEventListener('click', () => renderChart('month'));
    document.getElementById('btn-chart-year').addEventListener('click', () => renderChart('year'));

    // Enterキー入力対応
    document.getElementById('auth-password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin(e);
    });
  });
</script>
</body>
</html>
